# Publishes the web app (web-app/) to GitHub Pages.
# One-time setup: Settings › Pages › Build and deployment › Source: GitHub Actions.
name: Web app

on:
  push:
    branches: [main]
    paths: ["web-app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-app
      - id: deployment
        uses: actions/deploy-pages@v4
